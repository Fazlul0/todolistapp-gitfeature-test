<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { margin: 0 0 16px; font-size: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    input[type="date"] {
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    li.completed span { text-decoration: line-through; color: #888; }
    li input[type="checkbox"] { transform: scale(1.2); }
    li span { flex: 1; word-break: break-word; }
    li span.text { flex: 1; word-break: break-word; }
    li .due { font-size: 12px; color: #888; }
    li.overdue:not(.completed) .due { color: #c0392b; font-weight: 600; }
    li.due-soon:not(.completed) .due { color: #b45309; }
    .delete {
      background: transparent;
      color: #c0392b;
      padding: 4px 8px;
    }
    .delete:hover { background: #fde8e6; }
    .empty { color: #888; font-style: italic; }
    li .edit {
      flex: 1;
      padding: 4px 6px;
      font-size: 16px;
      border: 1px solid #2563eb;
      border-radius: 4px;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      font-size: 14px;
      color: #555;
    }
    .filters { display: flex; gap: 4px; }
    .filters button, .clear {
      background: transparent;
      color: #555;
      padding: 4px 8px;
      border: 1px solid transparent;
    }
    .filters button:hover, .clear:hover { background: #f1f5f9; }
    .filters button.active { border-color: #2563eb; color: #2563eb; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form id="form">
    <input id="input" type="text" placeholder="What needs doing?" autofocus />
    <input id="due" type="date" />
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>Nothing here yet.</p>
  <footer id="footer" hidden>
    <span id="count"></span>
    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <button type="button" id="clear" class="clear">Clear completed</button>
  </footer>

  <script>
    const STORAGE_KEY = "todoapp.items.v1";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const dueInput = document.getElementById("due");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const footer = document.getElementById("footer");
    const count = document.getElementById("count");
    const clearBtn = document.getElementById("clear");
    const filterBtns = document.querySelectorAll("[data-filter]");

    let items = load();
    let filter = "all";

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      list.innerHTML = "";
      const visible = items.filter((x) =>
        filter === "active" ? !x.done : filter === "completed" ? x.done : true
      );
      empty.hidden = visible.length > 0;
      empty.textContent = items.length === 0 ? "Nothing here yet." : `No ${filter} todos.`;

      const left = items.filter((x) => !x.done).length;
      footer.hidden = items.length === 0;
      count.textContent = `${left} item${left === 1 ? "" : "s"} left`;
      clearBtn.hidden = !items.some((x) => x.done);
      filterBtns.forEach((b) => b.classList.toggle("active", b.dataset.filter === filter));

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const MS = 86400000;

      for (const item of visible) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("completed");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = item.done;
        cb.addEventListener("change", () => {
          item.done = cb.checked;
          save();
          render();
        });

        const span = document.createElement("span");
        span.className = "text";
        span.textContent = item.text;
        span.title = "Double-click to edit";
        span.addEventListener("dblclick", () => startEdit(li, span, item));

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.textContent = "Delete";
        del.addEventListener("click", () => {
          items = items.filter((x) => x.id !== item.id);
          save();
          render();
        });

        li.append(cb, span);
        if (item.due) {
          const d = new Date(item.due + "T00:00:00");
          const diffDays = Math.round((d - today) / MS);
          const due = document.createElement("span");
          due.className = "due";
          due.textContent =
            diffDays < 0 ? `Overdue · ${formatDate(d)}` :
            diffDays === 0 ? `Due today` :
            diffDays === 1 ? `Due tomorrow` :
            `Due ${formatDate(d)}`;
          if (diffDays < 0) li.classList.add("overdue");
          else if (diffDays <= 3) li.classList.add("due-soon");
          li.append(due);
        }
        li.append(del);
        list.appendChild(li);
      }
    }

    function startEdit(li, span, item) {
      const edit = document.createElement("input");
      edit.type = "text";
      edit.className = "edit";
      edit.value = item.text;
      li.replaceChild(edit, span);
      edit.focus();
      edit.select();

      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        if (commit) {
          const text = edit.value.trim();
          if (text) item.text = text;
          else items = items.filter((x) => x.id !== item.id);
          save();
        }
        render();
      };
      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        else if (e.key === "Escape") finish(false);
      });
      edit.addEventListener("blur", () => finish(true));
    }

    filterBtns.forEach((b) =>
      b.addEventListener("click", () => {
        filter = b.dataset.filter;
        render();
      })
    );

    clearBtn.addEventListener("click", () => {
      items = items.filter((x) => !x.done);
      save();
      render();
    });

    function formatDate(d) {
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      items.push({ id: Date.now(), text, done: false, due: dueInput.value || null });
      input.value = "";
      dueInput.value = "";
      input.focus();
      save();
      render();
    });

    render();
  </script>
</body>
</html>
