<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    :root {
      color-scheme: light dark;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --hover: #f3f4f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --hover: #273449;
        --primary: #60a5fa;
        --primary-hover: #93c5fd;
        --primary-soft: #1e3a5f;
        --danger: #f87171;
        --danger-soft: #4a1a1a;
        --warn: #fbbf24;
        --warn-soft: #4a3a1a;
        --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 0 16px;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .icon { font-size: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"], input[type="date"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="date"] { flex: 0 0 auto; }
    input[type="text"]:focus, input[type="date"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.98); }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.2s, transform 0.2s;
    }
    li:last-child { border-bottom: none; }
    li.completed { opacity: 0.6; }
    li.completed .text { text-decoration: line-through; color: var(--muted); }

    /* Drag handle */
    .handle {
      cursor: grab;
      color: var(--muted);
      opacity: 0;
      padding: 2px 2px;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
      user-select: none;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      flex: 0 0 auto;
    }
    li:hover .handle { opacity: 1; }
    .handle:hover, .handle:focus-visible { background: var(--hover); color: var(--text); outline: none; }
    .handle:active { cursor: grabbing; }
    li.dragging { opacity: 0.4; }
    li.drag-over { border-top: 2px solid var(--primary); }

    /* Category chips */
    select#category {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select#category:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .search {
      position: relative;
      margin-bottom: 12px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
      opacity: 0.6;
    }
    .search input[type="search"] {
      width: 100%;
      padding: 10px 12px 10px 36px;
      font-size: 14px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search input[type="search"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .search input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
    .cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 999px;
      color: white;
      white-space: nowrap;
    }
    .cat.cat-work      { background: #2563eb; }
    .cat.cat-personal  { background: #16a34a; }
    .cat.cat-shopping  { background: #ea580c; }
    .cat.cat-urgent    { background: #dc2626; }
    .cat.cat-none      { display: none; }

    /* Repeat badge */
    .repeat {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      white-space: nowrap;
    }

    .check {
      position: relative;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      cursor: pointer;
    }
    .check input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }
    .check .box {
      position: absolute;
      inset: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      transition: background 0.15s, border-color 0.15s;
    }
    .check .box::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1px;
      width: 6px;
      height: 11px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      transition: transform 0.15s ease;
    }
    .check input:checked + .box {
      background: var(--primary);
      border-color: var(--primary);
    }
    .check input:checked + .box::after { transform: rotate(45deg) scale(1); }
    .check input:focus-visible + .box {
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .text {
      flex: 1;
      word-break: break-word;
      cursor: text;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .text:hover { background: var(--hover); }

    .due {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--hover);
      color: var(--muted);
      white-space: nowrap;
    }
    li.overdue:not(.completed) .due {
      background: var(--danger-soft);
      color: var(--danger);
    }
    li.due-soon:not(.completed) .due {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .delete {
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .delete:hover { background: var(--danger-soft); color: var(--danger); }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px 0;
      font-style: italic;
    }
    li .edit {
      flex: 1;
      padding: 6px 8px;
      font-size: 15px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--primary);
      border-radius: 6px;
      outline: none;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .filters { display: flex; gap: 4px; }
    .filters button, .clear {
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filters button:hover, .clear:hover {
      background: var(--hover);
      color: var(--text);
    }
    .filters button.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .clear:hover { color: var(--danger); }

    /* Undo toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 10px 10px 16px;
      font-size: 14px;
      color: var(--card);
      background: var(--text);
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }
    .toast button {
      padding: 6px 12px;
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
    }
    .toast button:hover { background: rgba(128, 128, 128, 0.25); }
  </style>
</head>
<body data-test-branch="test/test-branch">
  <!-- Test branch: marker for test/test-branch verification -->
  <div class="card">
    <h1><span class="icon" aria-hidden="true">✅</span> Todo</h1>
  <form id="form">
    <input id="input" type="text" placeholder="What needs doing?" autofocus />
    <input id="due" type="date" />
    <select id="repeat" aria-label="Repeat">
      <option value="none">No repeat</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <select id="category" aria-label="Category">
      <option value="none">No category</option>
      <option value="work">🟦 Work</option>
      <option value="personal">🟩 Personal</option>
      <option value="shopping">🟧 Shopping</option>
      <option value="urgent">🟥 Urgent</option>
    </select>
    <button type="submit">Add</button>
  </form>
  <div class="search">
    <span class="search-icon" aria-hidden="true">🔍</span>
    <input id="search" type="search" placeholder="Search…" aria-label="Search todos" />
  </div>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>Nothing here yet.</p>
  <footer id="footer" hidden>
    <span id="count"></span>
    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <button type="button" id="clear" class="clear">Clear completed</button>
  </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button type="button" id="undo">Undo</button>
  </div>

  <script>
    const STORAGE_KEY = "todoapp.items.v1";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const dueInput = document.getElementById("due");
    const categorySelect = document.getElementById("category");
    const repeatSelect = document.getElementById("repeat");
    const searchInput = document.getElementById("search");
    const CATEGORIES = { none: null, work: "Work", personal: "Personal", shopping: "Shopping", urgent: "Urgent" };
    const REPEAT_LABELS = { daily: "↻ Daily", weekly: "↻ Weekly", monthly: "↻ Monthly" };
    let query = "";

    function nextDue(repeat, fromIso) {
      if (!repeat || repeat === "none") return null;
      const base = fromIso ? new Date(fromIso + "T00:00:00") : new Date();
      if (repeat === "daily")   base.setDate(base.getDate() + 1);
      if (repeat === "weekly")  base.setDate(base.getDate() + 7);
      if (repeat === "monthly") base.setMonth(base.getMonth() + 1);
      return base.toISOString().slice(0, 10);
    }
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const footer = document.getElementById("footer");
    const count = document.getElementById("count");
    const clearBtn = document.getElementById("clear");
    const filterBtns = document.querySelectorAll("[data-filter]");

    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-msg");
    const undoBtn = document.getElementById("undo");
    const UNDO_MS = 5000;
    let lastRemoved = null;
    let toastTimer = null;

    let items = load();
    let filter = "all";

    function removeWithUndo(predicate) {
      const removed = [];
      items.forEach((item, index) => { if (predicate(item)) removed.push({ item, index }); });
      if (removed.length === 0) return;
      lastRemoved = removed;
      items = items.filter((x) => !predicate(x));
      save();
      render();
      toastMsg.textContent = removed.length === 1
        ? `Deleted "${removed[0].item.text}"`
        : `Deleted ${removed.length} todos`;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, UNDO_MS);
    }

    function hideToast() {
      toast.classList.remove("show");
      lastRemoved = null;
    }

    undoBtn.addEventListener("click", () => {
      if (!lastRemoved) return;
      for (const { item, index } of lastRemoved) {
        items.splice(Math.min(index, items.length), 0, item);
      }
      clearTimeout(toastTimer);
      hideToast();
      save();
      render();
    });

    function newId() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function load() {
      let stored;
      try {
        stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
      // Older saves used Date.now() ids, which can collide; give duplicates fresh ids.
      const seen = new Set();
      for (const item of stored) {
        if (item.id == null || seen.has(item.id)) item.id = newId();
        seen.add(item.id);
      }
      return stored;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      list.innerHTML = "";
      const q = query.trim().toLowerCase();
    const searched = q ? items.filter((x) => x.text.toLowerCase().includes(q)) : items;
    const visible = searched.filter((x) =>
        filter === "active" ? !x.done : filter === "completed" ? x.done : true
      );
      empty.hidden = visible.length > 0;
      empty.textContent = items.length === 0 ? "Nothing here yet." : `No ${filter} todos.`;

      const left = items.filter((x) => !x.done).length;
      footer.hidden = items.length === 0;
      count.textContent = `${left} item${left === 1 ? "" : "s"} left`;
      clearBtn.hidden = !items.some((x) => x.done);
      filterBtns.forEach((b) => b.classList.toggle("active", b.dataset.filter === filter));

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const MS = 86400000;

      for (const item of visible) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("completed");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = item.done;
        cb.setAttribute("aria-label", "Mark done");
        const check = document.createElement("label");
        check.className = "check";
        const box = document.createElement("span");
        box.className = "box";
        check.append(cb, box);
        cb.addEventListener("change", () => {
          item.done = cb.checked;
          // Reschedule recurring todos on completion
          if (item.done && item.repeat && item.repeat !== "none") {
            const next = nextDue(item.repeat, item.due);
            item.done = false;
            item.due = next;
            cb.checked = false;
          }
          save();
          render();
        });

        const span = document.createElement("span");
        span.className = "text";
        span.textContent = item.text;
        span.title = "Double-click to edit";
        span.addEventListener("dblclick", () => startEdit(li, span, item));

        const handle = document.createElement("span");
        handle.className = "handle";
        handle.textContent = "⋮⋮";
        handle.setAttribute("aria-label", "Drag to reorder");
        handle.setAttribute("draggable", "true");
        handle.addEventListener("dragstart", (e) => {
          li.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(item.id));
        });
        handle.addEventListener("dragend", () => {
          li.classList.remove("dragging");
          list.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
        });
        li.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          if (li.classList.contains("dragging")) return;
          list.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
          li.classList.add("drag-over");
        });
        li.addEventListener("dragleave", () => li.classList.remove("drag-over"));
        li.addEventListener("drop", (e) => {
          e.preventDefault();
          const id = e.dataTransfer.getData("text/plain");
          if (!id || id === String(item.id)) return;
          const fromIdx = items.findIndex((x) => String(x.id) === id);
          const toIdx = items.findIndex((x) => x.id === item.id);
          if (fromIdx === -1 || toIdx === -1) return;
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          save();
          render();
        });

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete");
        del.addEventListener("click", () => removeWithUndo((x) => x.id === item.id));

        li.append(handle, check, span);
        if (item.category && item.category !== "none") {
          const cat = document.createElement("span");
          cat.className = `cat cat-${item.category}`;
          cat.textContent = CATEGORIES[item.category] || item.category;
          li.append(cat);
        }
        if (item.repeat && item.repeat !== "none") {
          const rep = document.createElement("span");
          rep.className = "repeat";
          rep.textContent = REPEAT_LABELS[item.repeat] || item.repeat;
          li.append(rep);
        }
        if (item.due) {
          const d = new Date(item.due + "T00:00:00");
          const diffDays = Math.round((d - today) / MS);
          const due = document.createElement("span");
          due.className = "due";
          due.textContent =
            diffDays < 0 ? `Overdue · ${formatDate(d)}` :
            diffDays === 0 ? `Due today` :
            diffDays === 1 ? `Due tomorrow` :
            `Due ${formatDate(d)}`;
          if (diffDays < 0) li.classList.add("overdue");
          else if (diffDays <= 3) li.classList.add("due-soon");
          li.append(due);
        }
        li.append(del);
        list.appendChild(li);
      }
    }

    function startEdit(li, span, item) {
      const edit = document.createElement("input");
      edit.type = "text";
      edit.className = "edit";
      edit.value = item.text;
      li.replaceChild(edit, span);
      edit.focus();
      edit.select();

      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        const text = edit.value.trim();
        if (commit && !text) return removeWithUndo((x) => x.id === item.id);
        if (commit) {
          item.text = text;
          save();
        }
        render();
      };
      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        else if (e.key === "Escape") finish(false);
      });
      edit.addEventListener("blur", () => finish(true));
    }

    filterBtns.forEach((b) =>
      b.addEventListener("click", () => {
        filter = b.dataset.filter;
        render();
      })
    );

    clearBtn.addEventListener("click", () => removeWithUndo((x) => x.done));

    function formatDate(d) {
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      items.push({ id: newId(), text, done: false, due: dueInput.value || null, category: categorySelect.value, repeat: repeatSelect.value });
      input.value = "";
      dueInput.value = "";
      categorySelect.value = "none";
      repeatSelect.value = "none";
      input.focus();
      save();
      render();
    });

    render();

    searchInput.addEventListener("input", () => {
      query = searchInput.value;
      render();
    });
  </script>
</body>
</html>
